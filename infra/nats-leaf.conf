# NATS Leaf Node — Railway (WhatsApp bridge)
listen: 0.0.0.0:4222

jetstream {
  store_dir: /data/nats/jetstream
  max_mem: 128MB
  max_file: 512MB
}

leafnodes {
  remotes [
    {
      # Replace PI_IP with actual Pi address on hackathon WiFi
      url: "ws://PI_IP:8080"
    }
  ]
}

logtime: true
