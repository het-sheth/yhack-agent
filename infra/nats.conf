# NATS Server — Raspberry Pi (hub)
listen: 0.0.0.0:4222

jetstream {
  store_dir: /data/nats/jetstream
  max_mem: 256MB
  max_file: 1GB
}

websocket {
  listen: 0.0.0.0:8080
  no_tls: true  # TLS handled by reverse proxy if needed
}

# Leaf node server — Railway bridge connects here
leafnodes {
  listen: 0.0.0.0:7422
}

logtime: true
