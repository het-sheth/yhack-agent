<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BC82F3"/>
      <stop offset="25%" style="stop-color:#F5B9EA"/>
      <stop offset="50%" style="stop-color:#8D9FFF"/>
      <stop offset="75%" style="stop-color:#FF6778"/>
      <stop offset="100%" style="stop-color:#FFBA71"/>
    </linearGradient>
  </defs>
  <!-- Outer glow circle -->
  <circle cx="256" cy="220" r="140" fill="url(#orb)" opacity="0.15"/>
  <!-- Main orb -->
  <circle cx="256" cy="220" r="100" fill="#F2F2F7" stroke="url(#orb)" stroke-width="3"/>
  <!-- Mic icon -->
  <rect x="240" y="180" width="32" height="50" rx="16" fill="url(#orb)"/>
  <path d="M224 215 Q224 245 256 245 Q288 245 288 215" stroke="url(#orb)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <line x1="256" y1="245" x2="256" y2="260" stroke="url(#orb)" stroke-width="4" stroke-linecap="round"/>
  <line x1="242" y1="260" x2="270" y2="260" stroke="url(#orb)" stroke-width="4" stroke-linecap="round"/>
  <!-- Sound waves -->
  <path d="M300 195 Q315 220 300 245" stroke="url(#orb)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M315 180 Q338 220 315 260" stroke="url(#orb)" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.4"/>
  <!-- Wordmark -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="72" font-weight="600" fill="#000000">Yapper</text>
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="400" fill="#8E8E93">One voice. Every channel.</text>
</svg>
